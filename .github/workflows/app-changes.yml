name: App changes

permissions:
  contents: read

on:
  pull_request:
  push:
    branches: [rc, production]

concurrency:
  group: app-changes-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  affected-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: America/Los_Angeles
      PYTHONDONTWRITEBYTECODE: "1"
      BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
      EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify source and inspect affected checks
        id: selection
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test ! -e .gitmodules
          test -z "$(git ls-files --stage | awk '$1 == "160000" {print}')"
          python3 scripts/app_gate.py changed --base "$BASE_SHA" --head HEAD --plan > "$RUNNER_TEMP/selection.json"
          python3 -c 'import json, os; p=json.load(open(os.environ["RUNNER_TEMP"]+"/selection.json")); print("flutter="+str(bool(p["contracts"] or p["analyze"] or p["tests"] or p["browser"])).lower())' >> "$GITHUB_OUTPUT"
      - name: Set up pinned Flutter and Dart when needed
        if: steps.selection.outputs.flutter == 'true'
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.3"
          channel: stable
          cache: true
      - name: Run affected checks
        run: python3 scripts/app_gate.py changed --base "$BASE_SHA" --head HEAD --log-dir "$RUNNER_TEMP/app-changes"
      - name: Preserve results and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-changes-${{ github.sha }}
          path: ${{ runner.temp }}/app-changes
          retention-days: 7
      - name: Reject unexpected checkout mutations
        if: always()
        run: |
          set -euo pipefail
          git restore --worktree -- .flutter-plugins-dependencies
          git diff --check
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
